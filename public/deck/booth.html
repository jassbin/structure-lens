<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>照妖镜 · 摆摊速览</title>
<style>
  :root{ --cyan:#22d3ee; --bg:#05060a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1000px 600px at 30% 20%, rgba(34,211,238,.16), transparent 60%),
      radial-gradient(900px 500px at 85% 90%, rgba(59,130,246,.14), transparent 60%),
      var(--bg);
    color:#fff; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:5vh 6vw;
  }
  .page{ width:100%; max-width:1120px; }
  .brand{ font-size:clamp(48px,7vw,104px); font-weight:900; letter-spacing:-.02em; line-height:1; }
  .en{ color:#9ca3af; font-size:clamp(16px,2vw,26px); font-weight:600; margin-left:.5rem; }
  .slogan{ color:var(--cyan); font-size:clamp(22px,3.2vw,42px); font-weight:800; margin-top:1.2rem; line-height:1.4; }
  .desc{ color:#cbd5e1; font-size:clamp(15px,1.8vw,22px); margin-top:1.4rem; max-width:640px; line-height:1.7; }
  .row{ display:flex; gap:2.5rem; align-items:flex-end; margin-top:3rem; flex-wrap:wrap; }
  .col{ flex:1 1 380px; }
  .pills span{ display:inline-block; border:1px solid rgba(34,211,238,.45); color:var(--cyan);
    border-radius:999px; padding:.35rem 1rem; font-size:clamp(13px,1.5vw,18px); margin:.3rem .4rem .3rem 0; }
  .qr{ text-align:center; flex:0 0 auto; }
  .qr img{ width:clamp(180px,20vw,260px); height:auto; border-radius:18px; background:#fff; padding:14px; box-shadow:0 12px 40px rgba(34,211,238,.25); }
  .qr .cta{ margin-top:1rem; font-size:clamp(16px,1.8vw,22px); font-weight:800; }
  .qr .url{ color:#9ca3af; font-size:clamp(12px,1.3vw,15px); margin-top:.3rem; }
  .core{ margin-top:.4rem; }
  .core b{ color:var(--cyan); }
</style>
</head>
<body>
  <div class="page">
    <div class="brand">照妖镜<span class="en">Structure Lens</span></div>
    <div class="slogan">专治"表面一套、底下一套"</div>
    <div class="desc">
      把任意热点事件、政策或决策丢进来，AI 联网锁定真相，用一套固定的
      <b class="core"><b>8 步深度穿透</b></b>层层剥开表面叙事，
      还原背后的<b class="core">底层结构骨架</b>——谁在提取价值、谁被委托背锅、权力如何运作。
    </div>

    <div class="row">
      <div class="col">
        <div class="pills">
          <span>AI 原生</span><span>8 步穿透管线</span><span>结构骨架还原</span>
          <span>套路聚类</span><span>可辩论的 AI</span><span>只读分享卡</span>
        </div>
      </div>
      <div class="qr">
        <img src="/qr-booth.png" alt="扫码体验照妖镜" />
        <div class="cta">📱 扫码，立即照一照</div>
        <div class="url">structure-lens-8c3bf836.eazo.dev</div>
      </div>
    </div>
  </div>
</body>
</html>
